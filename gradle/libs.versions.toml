[versions]
springBootPluginVersion = "4.1.1"
springDependencyManagementPluginVersion = "1.1.7"
asciidoctorJvmPluginVersion = "4.0.5"
openapiGeneratorPluginVersion = "7.25.0"
googleJibPluginVersion = "3.5.4"
gradleNodePluginVersion = "7.1.0"

[libraries]
# --- Spring Boot starters (versions supplied by the BOM in :_SpringBootParent) ---
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-hateoas = { module = "org.springframework.boot:spring-boot-starter-hateoas" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

# --- Test starters (Spring Boot 4 split per concern) ---
spring-boot-starter-validation-test = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-hateoas-test = { module = "org.springframework.boot:spring-boot-starter-hateoas-test" }

# --- Runtime ---
# Pinned: H2 2.4.240 (Spring Boot 4.1.1 default) rejects inserts into columns with a string
# CHECK constraint, e.g. enums mapped with an AttributeConverter, in @DataJpaTest. Fixed in 2.5.252.
h2 = { module = "com.h2database:h2", version = "2.5.252" }

# --- Testing ---
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# --- Plugins for buildSrc ---
spring-boot-gradle-plugin = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "springBootPluginVersion" }
spring-dependency-management-gradle-plugin = { module = "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin", version.ref = "springDependencyManagementPluginVersion" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBootPluginVersion" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementPluginVersion" }

asciidoctor-jvm-convert = { id = "org.asciidoctor.jvm.convert", version.ref = "asciidoctorJvmPluginVersion" }
asciidoctor-jvm-pdf = { id = "org.asciidoctor.jvm.pdf", version.ref = "asciidoctorJvmPluginVersion" }

openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGeneratorPluginVersion" }

google-jib = { id = "com.google.cloud.tools.jib", version.ref = "googleJibPluginVersion" }

node-gradle = { id = "com.github.node-gradle.node", version.ref = "gradleNodePluginVersion" }
